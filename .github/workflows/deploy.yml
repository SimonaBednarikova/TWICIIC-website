# Deploys the static site in dist/ to the Websupport hosting of twiciic.eu over FTP
# on every push to main (and manually from the Actions tab).
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER    FTP host from the Websupport admin
#   FTP_USERNAME  FTP account name
#   FTP_PASSWORD  FTP account password
# Optional repository variables (same page → Variables):
#   FTP_SERVER_DIR  folder on the server that serves twiciic.eu, ending with "/" (default "./")
#   FTP_PROTOCOL    "ftps" (default) or "ftp" if the server does not offer TLS
#
# Only changed files are uploaded; the action keeps a small state file
# (.ftp-deploy-sync-state.json) on the server for that.

name: Deploy to twiciic.eu

on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP secrets are not set yet, skipping deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Upload dist/ over FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.DS_Store
